[package]
name = "Z-Sharp"
version = "0.0.1"
kind = "lib"
description = "Rdzeń bootstrapu Z#: stage0 (Rust), runtime + ZAMM, biblioteki wspólne dla zsc/zsi/zst/zzc"
license = "GPL-3.0"

# `import Workspace.<człon>;` rozwiązuje się przez tę tabelę (ścieżki względem tego pliku).
[workspace.members]
lexer  = "lib/lexer.zsharp"
parser = "lib/parser.zsharp"
cli    = "lib/cli.zsharp"
zbc    = "lib/zbc.zsharp"
sema   = "lib/sema.zsharp"
zamm_config = "zamm/config.zsharp"
zamm_errors = "zamm/errors.zsharp"
zamm_chunk  = "zamm/chunk.zsharp"
zamm_arena  = "zamm/arena.zsharp"
zamm_heap   = "zamm/heap.zsharp"
zamm_shared = "zamm/shared.zsharp"
zamm        = "zamm/main.zsharp"
runtime     = "runtime/main.zsharp"
ir          = "lib/ir.zsharp"
link        = "lib/link.zsharp"
classes     = "lib/classes.zsharp"
closures    = "lib/closures.zsharp"
prelude     = "lib/prelude.zsharp"
emit_c      = "lib/emit_c.zsharp"
emit_llvm   = "lib/emit_llvm.zsharp"
manifest    = "lib/manifest.zsharp"
Scripts     = "scripts/lib.zsharp"

[bootstrap]
stage0 = "stage0"             # interpreter AST w Rust (zsc0)
stage1 = "lib/parser.zsharp"  # frontend napisany w Z#, uruchamiany przez stage0
zbc    = "lib/zbc.zsharp"     # kontener .zbc: program bez źródeł, wykonywany przez `zsc0 exec`
parity = ["scripts/tests/lexer_parity.zsharp", "scripts/tests/parser_parity.zsharp"]
fixpoint = "scripts/fixpoint.zsharp"   # zsc kompiluje sam siebie; stage1 == stage2 == stage3

[memory]                      # domyślna konfiguracja ZAMM (zob. zamm/README.md)
chunk-kib       = 64
max-chunk-kib   = 1024
large-object-kib = 256
retain-chunks   = 4
